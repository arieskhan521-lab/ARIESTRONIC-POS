name: Build ARIESTRONIC POS V10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'AriestronicPOS_Android_Source_v10_Diskon.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "File AriestronicPOS_Android_Source_v10_Diskon.zip tidak ditemukan di folder utama repository."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "File gradlew tidak ditemukan di dalam ZIP."
            echo "Periksa apakah ZIP berisi source project Android lengkap."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIESTRONIC-POS-V10
          path: extracted/**/*.apk
          if-no-files-found: error
